# AEx Options

SkipLongbow = 0
# Skip the Longbow Games splash screen

NoScreenTransition = 0
# Disable the carpet rolling screen transition

HoldClickFire = 0
# Hold left-click to fire from the laser paddle every 200ms

LaunchAngle = 0
# Restore the original launch angle for new balls

RehabMode = 0
# Unlimited paddles and number-key ball speeds (1 slowest, 0 fastest)
# Disables local high-score entry and online score submission
# Saved Rehab games remain ineligible after turning RehabMode off

DisableDangerousLua = 1
# Disable execution of dangerous lua commands from community content (default=1)

DisableAchievementReset = 1
# Prevents a "cheat code" from resetting Steam achievements (default=1)

CheckForUpdates = 1
# Check at startup for AEx updates

Log = 0
# Disable / Enable Logging
